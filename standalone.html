<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Grade Next Scratch Coding Academy — a topic-by-topic, game-focused Scratch curriculum for ages 7–12. Two levels, 100 hands-on sessions, and an offline Block Lab." />
  <meta name="theme-color" content="#4c97ff" />
  <title>Grade Next · Scratch Coding Academy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E" />
  <style>
/* =====================================================================
   GRADE NEXT — SCRATCH CODING ACADEMY
   styles.css — one stylesheet, no dependencies, embed-friendly
   ===================================================================== */

:root {
  --bg: #f4f7fc;
  --surface: #ffffff;
  --ink: #1f2a3d;
  --ink-soft: #55617a;
  --ink-faint: #8a93a8;
  --line: #e2e8f4;
  --brand: #4c97ff;
  --brand-dark: #2f6fd6;
  --accent: #4c97ff;          /* overridden per level */
  --good: #2fae66;
  --warn: #e9930b;
  --bad: #e0483d;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(31, 42, 61, .08), 0 1px 2px rgba(31, 42, 61, .06);
  --shadow-md: 0 6px 20px rgba(31, 42, 61, .10);
  --shadow-lg: 0 16px 40px rgba(31, 42, 61, .14);
  --maxw: 1080px;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  font-size: 17px;
  line-height: 1.55;
}
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .4em; }
p { margin: 0 0 .8em; }
a { color: var(--brand-dark); }
button { font-family: inherit; cursor: pointer; }
code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: .9em; background: #eef2fa; padding: .1em .4em; border-radius: 6px; }

/* ---------------- Buttons ---------------- */
.btn {
  border: 0; border-radius: 999px; padding: 11px 20px; font-size: 15px; font-weight: 700;
  background: #e9eef8; color: var(--ink); transition: transform .08s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn.primary:hover { box-shadow: var(--shadow-md); filter: brightness(1.03); }
.btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
.btn.block { width: 100%; margin-top: 12px; }
.btn.complete { background: #eef2fa; color: var(--ink-soft); border: 2px solid var(--line); }
.btn.complete.is-done { background: var(--good); color: #fff; border-color: var(--good); }
.linkish { background: none; border: 0; color: var(--brand-dark); font: inherit; padding: 0; text-decoration: underline; }

/* ---------------- Header ---------------- */
.site-head {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-mark { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.12)); }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.2px; }
.brand-sub { font-size: 12px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.site-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav-btn { border: 0; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 999px; }
.nav-btn:hover { background: #eef2fa; color: var(--ink); }
.nav-btn.active { background: var(--brand); color: #fff; }
.head-progress { margin-left: 6px; }

/* progress ring */
.ring { position: relative; width: 46px; height: 46px; }
.ring svg { width: 46px; height: 46px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #e6ecf7; stroke-width: 3.5; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--ink-soft); }

/* ---------------- Layout ---------------- */
.site-main { max-width: var(--maxw); margin: 0 auto; padding: 26px 20px 40px; }
.site-main.embed { padding-top: 16px; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------------- Crumbs ---------------- */
.crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-faint); margin-bottom: 16px; }
.crumb { border: 0; background: none; color: var(--brand-dark); font: inherit; padding: 0; cursor: pointer; }
.crumb:hover { text-decoration: underline; }
.crumb-sep { color: var(--ink-faint); }

/* ---------------- Home / hero ---------------- */
.hero { text-align: center; padding: 26px 10px 30px; }
.hero h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
.hero-sub { max-width: 680px; margin: 0 auto 20px; color: var(--ink-soft); font-size: 18px; }
.hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.level-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 10px 0 26px; }
.level-card {
  background: var(--surface); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm);
  border: 1px solid var(--line); border-top: 5px solid var(--accent); display: flex; flex-direction: column;
}
.level-card:hover { box-shadow: var(--shadow-md); }
.lc-top { display: flex; align-items: center; gap: 14px; }
.lc-emoji { font-size: 40px; }
.lc-eyebrow { text-transform: uppercase; font-size: 12px; font-weight: 800; letter-spacing: .6px; color: var(--accent); }
.lc-top h3 { font-size: 24px; margin: 0; }
.lc-tag { font-size: 16px; margin-top: 12px; }
.lc-age { color: var(--ink-faint); font-size: 14px; }
.lc-meta { display: flex; gap: 8px; margin: 4px 0 14px; }
.pill { background: #eef2fa; color: var(--ink-soft); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.lc-progress { margin-top: auto; }
.bar { height: 9px; background: #e9eef8; border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
.bar-label { font-size: 12px; color: var(--ink-faint); font-weight: 700; }

.home-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 26px; }
.strip-card { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow-sm); }
.strip-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.sc-emoji { font-size: 30px; }
.strip-card h4 { font-size: 18px; margin: 0 0 4px; }
.strip-card p { margin: 0; color: var(--ink-soft); font-size: 14px; }

/* search */
.search-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.search-input { width: 100%; border: 2px solid var(--line); border-radius: 999px; padding: 12px 18px; font-size: 16px; outline: none; }
.search-input:focus { border-color: var(--brand); }
.search-results { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.search-hit { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: #f6f9fe; border-radius: var(--radius-sm); padding: 10px 12px; }
.search-hit:hover { background: #eaf1fd; }
.sh-emoji { font-size: 20px; }
.sh-title { font-weight: 700; }
.sh-module { margin-left: auto; font-size: 12px; color: var(--ink-faint); }
.search-empty, .search-more { color: var(--ink-faint); font-size: 14px; padding: 6px 4px; }

/* ---------------- Level view ---------------- */
.level-hero { display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); margin-bottom: 18px; }
.lh-eyebrow { text-transform: uppercase; font-size: 12px; font-weight: 800; letter-spacing: .6px; color: var(--accent); }
.level-hero h1 { font-size: clamp(24px, 4vw, 34px); margin: 2px 0 6px; }
.lh-tag { font-size: 17px; margin: 0 0 2px; }
.lh-age { color: var(--ink-faint); font-size: 14px; margin: 0; }
.lh-progress { margin-left: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lh-progress .ring { width: 64px; height: 64px; } .lh-progress .ring svg { width: 64px; height: 64px; }
.lh-progress span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }

.module-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.chip { border: 2px solid var(--line); background: #fff; color: var(--ink-soft); font-weight: 700; font-size: 13px; padding: 7px 14px; border-radius: 999px; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.sg-head { display: flex; align-items: baseline; gap: 12px; margin: 24px 0 12px; }
.sg-head h2 { font-size: 20px; margin: 0; }
.sg-count { font-size: 13px; color: var(--ink-faint); font-weight: 700; }
.session-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

.session-card { position: relative; display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .1s ease, box-shadow .15s ease; }
.session-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent); }
.session-card.done { border-color: #bfe6cf; background: #f6fdf9; }
.sc-num { flex: 0 0 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
.session-card.done .sc-num { background: var(--good); }
.sc-body { min-width: 0; }
.sc-emoji-title { display: flex; align-items: center; gap: 8px; }
.sc-emoji-title h3 { font-size: 17px; margin: 0; }
.sc-emoji-title .sc-emoji { font-size: 20px; }
.sc-concept { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sc-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #eef2fa; color: var(--ink-soft); }
.tag.theme { background: #fff4e6; color: #b5710a; }
.tag.proj { background: #eef7ff; color: var(--brand-dark); }
.tag.mod { background: #f0ecff; color: #6a4fd0; }
.sc-check { position: absolute; top: 12px; right: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }

/* ---------------- Session detail ---------------- */
.session-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.sh-eyebrow { font-size: 13px; color: var(--ink-faint); font-weight: 700; }
.session-head h1 { font-size: clamp(24px, 4vw, 34px); margin: 4px 0 10px; }
.sh-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.session-head .btn.complete { flex: 0 0 auto; margin-left: auto; }

.callout { display: flex; gap: 14px; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; }
.callout .co-icon { font-size: 26px; line-height: 1; }
.co-label { text-transform: uppercase; font-size: 11px; letter-spacing: .6px; font-weight: 800; color: var(--ink-faint); margin-bottom: 4px; }
.callout p { margin: 0 0 6px; }
.callout p:last-child { margin: 0; }
.big-idea { background: linear-gradient(135deg, #eef6ff, #f4f0ff); border: 1px solid #dfe8fb; }
.big-idea .objective { color: var(--ink-soft); font-size: 15px; }
.challenge { background: #fff6ec; border: 1px solid #ffe0bd; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.panel h3 { font-size: 18px; margin: 0 0 12px; }

.block-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.block-chip { position: relative; font-size: 13.5px; font-weight: 700; color: #fff; padding: 7px 13px; border-radius: 10px; background: var(--bc, #888); box-shadow: 0 2px 0 rgba(0,0,0,.12) inset, var(--shadow-sm); }
.block-chip.cat-events, .block-chip.cat-operators { color: #23303f; }

.exercise-list { margin: 0; padding-left: 22px; }
.exercise-list li { margin-bottom: 12px; }
.exercise-list li::marker { font-weight: 800; color: var(--accent); }

.project-panel { border-left: 5px solid var(--accent); }
.pp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pp-emoji { font-size: 24px; } .pp-head h3 { margin: 0; }
.pp-brief { font-size: 16px; }
.pp-label { text-transform: uppercase; font-size: 11px; letter-spacing: .6px; font-weight: 800; color: var(--ink-faint); margin: 10px 0 6px; }
.must-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.must-chip { font-size: 13px; font-weight: 600; background: #eef2fa; color: var(--ink-soft); padding: 5px 11px; border-radius: 8px; border: 1px dashed #c7d2e6; }
.pp-stretch { margin-top: 12px; background: #fffdf5; border: 1px solid #f2e6bf; border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.two-col .panel { margin-bottom: 0; }
.vocab-list { display: flex; gap: 8px; flex-wrap: wrap; }
.vocab { background: #f0ecff; color: #5a41c0; font-weight: 700; font-size: 13.5px; padding: 6px 12px; border-radius: 999px; }
.checklist { display: flex; flex-direction: column; gap: 8px; }
.check-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: #f7f9fd; cursor: pointer; font-size: 15px; }
.check-item:hover { background: #eff4fc; }
.check-item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--good); flex: 0 0 auto; }
.check-item.ticked { background: #eefbf3; color: var(--ink-soft); }
.check-item.ticked span { text-decoration: line-through; }

.scratch-cta { text-align: center; background: linear-gradient(135deg, #fff7ec, #ffeede); border: 1px solid #ffdfc0; border-radius: var(--radius); padding: 22px; margin: 18px 0; }
.scratch-cta p { font-weight: 700; margin-bottom: 10px; }
.scratch-cta .cta-note { display: block; margin-top: 10px; font-size: 13px; color: var(--ink-faint); }

/* Scratch starter project panel */
.starter-panel { border-left: 5px solid #ff8c1a; background: linear-gradient(180deg, #fffaf2, var(--surface)); }
.sp-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 6px; }
.sp-head .sp-emoji { font-size: 30px; line-height: 1; }
.sp-head h3 { margin: 0 0 4px; }
.sp-head p { margin: 0; color: var(--ink-soft); font-size: 14.5px; }
.sp-sprites { margin: 14px 0; }
.sp-label { display: block; text-transform: uppercase; font-size: 11px; letter-spacing: .6px; font-weight: 800; color: var(--ink-faint); margin-bottom: 8px; }
.sprite-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.sprite-chip { font-size: 14px; font-weight: 700; background: #fff3e2; color: #a85f00; border: 1px solid #ffd9a8; padding: 6px 12px; border-radius: 999px; }
.sp-backdrop { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--ink-faint); font-weight: 600; }
.sp-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
.sp-steps { margin: 10px 0 6px; padding-left: 22px; }
.sp-steps li { margin-bottom: 6px; }
.sp-steps li::marker { font-weight: 800; color: #ff8c1a; }
.sp-note { font-size: 13.5px; color: var(--ink-faint); margin: 8px 0 0; }

.session-nav { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.sn-spacer { flex: 1; }
.session-nav .btn { max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- Teacher guide ---------------- */
.teacher .lead { font-size: 18px; color: var(--ink-soft); max-width: 720px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.table-scroll { overflow-x: auto; }
.data-table th, .data-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.data-table th { background: #f3f7fd; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-soft); }
.data-table tr:last-child td { border-bottom: 0; }
.muted { color: var(--ink-faint); font-size: 14px; }
.cat-key { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-swatch { color: #fff; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 8px; background: var(--bc); }
.map-lv { margin-top: 18px; }
.map-modules { margin: 0 0 6px; padding-left: 20px; }
.map-modules li { margin-bottom: 4px; }
.code-block { background: #1e2635; color: #d7e0f0; padding: 16px; border-radius: var(--radius-sm); overflow-x: auto; font-size: 13px; line-height: 1.5; }

/* ---------------- Footer ---------------- */
.site-foot { max-width: var(--maxw); margin: 0 auto; padding: 24px 20px 40px; text-align: center; color: var(--ink-faint); font-size: 14px; border-top: 1px solid var(--line); }
.foot-links { margin-top: 4px; }

/* =====================================================================
   BLOCK LAB
   ===================================================================== */
.lab-host { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.bl-root { padding: 18px; }
.bl-head h2 { font-size: 22px; margin: 0 0 4px; }
.bl-sub { font-size: 13px; color: var(--ink-faint); font-weight: 600; }
.bl-intro { color: var(--ink-soft); font-size: 14.5px; max-width: 760px; }

.bl-levels { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.bl-lvtab { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.bl-lvtab:hover { border-color: var(--brand); }
.bl-lvtab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.bl-lvstars { color: #ffcf33; margin-left: 4px; letter-spacing: -1px; }
.bl-lvtab.on .bl-lvstars { color: #fff; }

.bl-mission { display: flex; gap: 12px; align-items: center; background: #f3f8ff; border: 1px solid #d9e7fb; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; }
.bl-mission-text { flex: 1; font-size: 14.5px; }
.bl-mtitle { font-size: 15px; }
.bl-idea { color: var(--brand-dark); font-weight: 700; font-size: 13px; }
.bl-mission-btns { display: flex; gap: 6px; flex: 0 0 auto; }

.bl-btn { border: 0; border-radius: 999px; padding: 9px 15px; font-weight: 700; font-size: 14px; background: #e9eef8; color: var(--ink); }
.bl-btn:hover { filter: brightness(.98); }
.bl-btn:disabled { opacity: .5; cursor: default; }
.bl-go { background: #3ac06d; color: #fff; }
.bl-stop { background: #e0483d; color: #fff; }

.bl-main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bl-stagewrap { display: flex; flex-direction: column; }
.bl-stage { width: 100%; height: auto; background: #eaf3ff; border: 2px solid #cfe0f5; border-radius: var(--radius-sm); display: block; aspect-ratio: 4 / 3; }
.bl-status { min-height: 22px; margin: 10px 0; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.bl-status.good { color: var(--good); } .bl-status.bad { color: var(--bad); } .bl-status.warn { color: var(--warn); }
.bl-controls { display: flex; gap: 8px; flex-wrap: wrap; }

.bl-code { display: flex; gap: 12px; }
.bl-palette { flex: 0 0 150px; background: #f7f9fd; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; align-self: flex-start; }
.bl-palette-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 8px; }
.bl-pblock { display: block; width: 100%; text-align: left; border: 0; color: #fff; font-weight: 700; font-size: 13px; padding: 9px 11px; border-radius: 8px; margin-bottom: 7px; box-shadow: 0 2px 0 rgba(0,0,0,.15) inset; }
.bl-pblock:hover { transform: translateX(2px); }
.bl-palette-tip { font-size: 11px; color: var(--ink-faint); margin-top: 6px; line-height: 1.35; }

.bl-scriptwrap { flex: 1; min-width: 0; }
.bl-scripthead { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.bl-script { min-height: 260px; background: #fbfcfe; border: 2px dashed #d5deee; border-radius: var(--radius-sm); padding: 10px; }
.bl-empty { color: var(--ink-faint); font-size: 14px; text-align: center; padding: 40px 10px; }

/* Scratch-faithful block colours */
.cat-motion { background: #4c97ff; }
.cat-looks  { background: #9966ff; }
.cat-sound  { background: #cf63cf; }
.cat-control{ background: #ffab19; }
.cat-events { background: #ffbf00; color: #23303f !important; }
.cat-sensing{ background: #5cb1d6; }

.bl-block { border-radius: 9px; margin-bottom: 6px; color: #fff; box-shadow: var(--shadow-sm); }
.bl-block.sel { outline: 3px solid #ffd84d; }
.bl-block-row { display: flex; align-items: center; gap: 6px; padding: 9px 11px; font-weight: 700; font-size: 14px; }
.bl-block-label { cursor: pointer; }
.bl-mini { border: 0; width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,.35); color: #fff; font-weight: 900; font-size: 15px; line-height: 1; }
.cat-events .bl-mini { background: rgba(0,0,0,.15); color: #23303f; }
.bl-mini:hover { background: rgba(255,255,255,.55); }
.bl-say-input { border: 0; border-radius: 6px; padding: 4px 8px; font-size: 13px; font-weight: 600; min-width: 0; width: 120px; }
.bl-toolbar { display: flex; gap: 4px; padding: 0 8px 8px; }
.bl-tool { border: 0; width: 28px; height: 26px; border-radius: 6px; background: rgba(255,255,255,.3); color: #fff; font-weight: 800; }
.cat-events .bl-tool { background: rgba(0,0,0,.15); color: #23303f; }
.bl-tool:hover { background: rgba(255,255,255,.55); }

.bl-slot { margin: 0 0 4px 18px; padding: 6px; border-left: 4px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); border-radius: 0 8px 8px 0; min-height: 20px; }
.bl-slot.active { background: rgba(255,255,255,.28); box-shadow: 0 0 0 2px #ffd84d inset; }
.bl-slot-ph { font-size: 12px; color: rgba(255,255,255,.9); font-weight: 600; padding: 4px 6px; }
.bl-repeat-end { height: 12px; border-radius: 0 0 9px 9px; margin-top: -2px; }

/* ---------------- Responsive ---------------- */
@media (max-width: 860px) {
  body { font-size: 16px; }
  .level-cards, .home-strip, .session-grid, .two-col { grid-template-columns: 1fr; }
  .bl-main { grid-template-columns: 1fr; }
  .site-nav { width: 100%; margin-left: 0; order: 3; }
  .head-progress { margin-left: auto; }
  .level-hero { flex-direction: column; align-items: flex-start; }
  .lh-progress { margin-left: 0; flex-direction: row; }
  .session-head { flex-direction: column; }
  .session-head .btn.complete { margin-left: 0; }
  .session-nav { flex-wrap: wrap; }
  .session-nav .btn { max-width: 100%; width: 100%; }
  .sn-spacer { display: none; }
}
@media (max-width: 560px) {
  .bl-code { flex-direction: column; }
  .bl-palette { flex: 1 1 auto; }
  .bl-pblock { display: inline-block; width: auto; margin-right: 6px; }
}

/* ---------------- Dark mode (respect user preference) ---------------- */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121722; --surface: #1b2230; --ink: #e8edf6; --ink-soft: #aab6c9; --ink-faint: #7f8ca3;
    --line: #2b3547; --shadow-sm: 0 1px 3px rgba(0,0,0,.4); --shadow-md: 0 6px 20px rgba(0,0,0,.5); --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
  }
  .site-head { background: rgba(27,34,48,.92); }
  code { background: #2a3346; color: #d7e0f0; }
  .btn { background: #2a3346; color: var(--ink); }
  .btn.ghost { background: #1b2230; }
  .btn.complete { background: #2a3346; }
  .nav-btn:hover { background: #263047; }
  .pill, .tag, .must-chip { background: #263047; color: var(--ink-soft); }
  .tag.theme { background: #3a2f1c; color: #ffcf80; }
  .tag.proj { background: #1e2c40; color: #8fbcff; }
  .tag.mod { background: #2b2447; color: #c3b0ff; }
  .big-idea { background: linear-gradient(135deg, #1a2436, #221e39); border-color: #313a52; }
  .challenge { background: #2b2417; border-color: #4a3d1e; }
  .strip-card, .session-card, .panel, .level-card, .level-hero, .search-block { background: var(--surface); }
  .session-card.done { background: #17281f; border-color: #2f5f3f; }
  .search-hit { background: #232c3d; } .search-hit:hover { background: #2a3547; }
  .search-input { background: #131a26; color: var(--ink); }
  .bar, .ring-bg { background: #2a3346; } .ring-bg { stroke: #2a3346; }
  .check-item { background: #212a3a; } .check-item:hover { background: #263047; }
  .check-item.ticked { background: #17281f; }
  .chip { background: #1b2230; border-color: var(--line); color: var(--ink-soft); }
  .data-table th { background: #212a3a; }
  .vocab { background: #2b2447; color: #c3b0ff; }
  .scratch-cta { background: linear-gradient(135deg, #2a2317, #2e2213); border-color: #4a3d1e; }
  .starter-panel { background: linear-gradient(180deg, #241d12, var(--surface)); border-left-color: #ff8c1a; }
  .sprite-chip { background: #2e2417; color: #ffc178; border-color: #4a3d1e; }
  .bl-mission { background: #1a2436; border-color: #313a52; }
  .bl-palette, .bl-script { background: #131a26; border-color: var(--line); }
  .bl-stage { background: #16202f; border-color: #2b3547; }
  .bl-lvtab { background: #1b2230; border-color: var(--line); color: var(--ink-soft); }
  .bl-say-input { background: #e8edf6; color: #1b2230; }
  .pp-stretch { background: #241f12; border-color: #4a3d1e; }
}

  <script>
/* =====================================================================
   GRADE NEXT — SCRATCH CODING ACADEMY
   BLOCK LAB — a tiny, offline, tap-to-code playground
   ---------------------------------------------------------------------
   Why it exists: young students (7–9) struggle to DRAG blocks and to
   read a 120-block palette. Block Lab lets concepts land first —
   sequence, turning, loops, debugging — with TAP-to-add blocks in
   Scratch-faithful colours. When they open real Scratch later, they
   already know what a loop is; they just have to find the block.

   No libraries, no network. Everything is drawn on a <canvas> + DOM.
   Progress (best stars per challenge) is saved to localStorage.
   ===================================================================== */
(function () {
  "use strict";

  // ---- Grid direction helpers -------------------------------------------
  var DIRS = ["up", "right", "down", "left"]; // clockwise
  var DELTA = {
    up: { dc: 0, dr: -1 },
    right: { dc: 1, dr: 0 },
    down: { dc: 0, dr: 1 },
    left: { dc: -1, dr: 0 }
  };

  // ---- Built-in challenges ----------------------------------------------
  // Each challenge maps to a core coding idea. Par = shortest known block
  // count → 3 stars. Correct-but-long earns 1–2 stars (efficiency lesson).
  var LEVELS = [
    {
      title: "Wake Up, Pip",
      idea: "A program is a plan",
      mission: "Press GO. Nothing happens! Add a Move block, set it to 3, and reach the star.",
      hint: "Tap the blue 'move' block once. Tap + until it says 3. Then press GO.",
      cols: 6, rows: 4, par: 1,
      start: { col: 1, row: 2, dir: "right" },
      stars: [{ col: 4, row: 2 }],
      walls: []
    },
    {
      title: "Around the Corner",
      idea: "Turning and facing",
      mission: "The star is up and to the right. Move, turn, and move again to collect it.",
      hint: "Move to below the star, then 'turn left' to face up, then move up.",
      cols: 6, rows: 5, par: 3,
      start: { col: 1, row: 4, dir: "right" },
      stars: [{ col: 4, row: 1 }],
      walls: []
    },
    {
      title: "The Long Path",
      idea: "Collect them all",
      mission: "Collect all three stars in a row. One big Move is tidier than three small ones!",
      hint: "Try a single 'move 4' instead of four separate moves. Fewer blocks = more stars.",
      cols: 7, rows: 3, par: 1,
      start: { col: 1, row: 1, dir: "right" },
      stars: [{ col: 3, row: 1 }, { col: 4, row: 1 }, { col: 5, row: 1 }],
      walls: []
    },
    {
      title: "The Staircase",
      idea: "Repeat (loops!)",
      mission: "Climb the staircase of stars. Notice the pattern: move, turn, move, turn… Use a REPEAT!",
      hint: "The pattern 'move 1, turn left, move 1, turn right' repeats. Wrap it in a repeat block.",
      cols: 6, rows: 6, par: 4,
      start: { col: 0, row: 5, dir: "right" },
      stars: [{ col: 1, row: 4 }, { col: 2, row: 3 }, { col: 3, row: 2 }, { col: 4, row: 1 }],
      walls: []
    },
    {
      title: "Hedge Maze",
      idea: "Debugging",
      mission: "Guide Pip through the hedges to the star. Bumping a hedge crashes the program!",
      hint: "Plan the whole path first. If you crash, look at the block that ran just before.",
      cols: 7, rows: 5, par: 6,
      start: { col: 0, row: 0, dir: "right" },
      stars: [{ col: 6, row: 4 }],
      walls: [
        { col: 2, row: 0 }, { col: 2, row: 1 }, { col: 2, row: 2 },
        { col: 4, row: 2 }, { col: 4, row: 3 }, { col: 4, row: 4 }
      ]
    },
    {
      title: "The Square Dance",
      idea: "Loops make shapes",
      mission: "Collect the four corner stars by walking a square. A repeat 4 is perfect here.",
      hint: "repeat 4 [ move 3, turn right ]. Start facing right from the top-left star.",
      cols: 6, rows: 6, par: 3,
      start: { col: 1, row: 1, dir: "right" },
      stars: [{ col: 1, row: 1 }, { col: 4, row: 1 }, { col: 4, row: 4 }, { col: 1, row: 4 }],
      walls: []
    },
    {
      title: "Pip's Playground",
      idea: "Free creation (Sandbox)",
      mission: "No goals here — just play! Try every block. Make Pip walk, spin, talk, and loop.",
      hint: "Try a repeat with 'turn right' and 'say' inside it to make Pip spin and chat.",
      cols: 8, rows: 6, par: 0, sandbox: true,
      start: { col: 3, row: 3, dir: "right" },
      stars: [],
      walls: []
    }
  ];

  // ---- Palette definition (Scratch-faithful colours) --------------------
  var PALETTE = [
    { type: "move", cat: "motion", label: "move ( ) steps", stepper: true },
    { type: "left", cat: "motion", label: "turn ↺ left" },
    { type: "right", cat: "motion", label: "turn ↻ right" },
    { type: "say", cat: "looks", label: "say ( )", text: true },
    { type: "wait", cat: "control", label: "wait ( ) sec", stepper: true, frac: true },
    { type: "repeat", cat: "control", label: "repeat ( )", stepper: true, container: true }
  ];

  var SPEEDS = [
    { label: "🐢 Slow", ms: 620 },
    { label: "🚶 Medium", ms: 320 },
    { label: "🐇 Fast", ms: 130 }
  ];

  var uidCounter = 0;
  function uid() { return "b" + (++uidCounter); }

  // ---- The Block Lab object ---------------------------------------------
  var BL = {
    mounted: false,
    el: {},          // cached DOM elements
    levelIndex: 0,
    program: [],     // AST: array of block objects
    selectedId: null,
    insertTargetId: null, // id of a repeat block whose children we insert into, or null = root
    running: false,
    speedIndex: 1,
    sprite: null,
    stars: [],       // remaining stars {col,row}
    bubble: "",      // current say text
    crashed: false
  };

  var STORE_KEY = "gn_blocklab_stars";

  function loadStars() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveStars(idx, stars) {
    var s = loadStars();
    if (!s[idx] || s[idx] < stars) { s[idx] = stars; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  // ---------------------------------------------------------------------
  //  MOUNTING / DOM
  // ---------------------------------------------------------------------
  BL.mount = function (container) {
    if (this.mounted && this.el.root && this.el.root.parentNode === container) {
      return; // already mounted here
    }
    container.innerHTML = "";
    var root = document.createElement("div");
    root.className = "bl-root";
    root.innerHTML = [
      '<div class="bl-head">',
      '  <h2>🧪 Block Lab <span class="bl-sub">tap-to-code playground</span></h2>',
      '  <p class="bl-intro">Practise the big ideas — sequence, turning, loops, debugging — before you open real Scratch. Tap a coloured block to add it. Tap a block in your program to move, copy or delete it.</p>',
      '</div>',
      '<div class="bl-levels" role="tablist" aria-label="Challenges"></div>',
      '<div class="bl-mission">',
      '  <div class="bl-mission-text"><strong class="bl-mtitle"></strong> <span class="bl-idea"></span><br><span class="bl-mbody"></span></div>',
      '  <div class="bl-mission-btns">',
      '    <button class="bl-btn bl-read" title="Read the mission aloud">🔊 Read</button>',
      '    <button class="bl-btn bl-hint" title="Show a hint">💡 Hint</button>',
      '  </div>',
      '</div>',
      '<div class="bl-main">',
      '  <div class="bl-stagewrap">',
      '    <canvas class="bl-stage" width="480" height="360" aria-label="Game stage"></canvas>',
      '    <div class="bl-status"></div>',
      '    <div class="bl-controls">',
      '      <button class="bl-btn bl-go">▶ GO</button>',
      '      <button class="bl-btn bl-stop" disabled>■ Stop</button>',
      '      <button class="bl-btn bl-reset">↺ Reset Pip</button>',
      '      <button class="bl-btn bl-speed"></button>',
      '      <button class="bl-btn bl-clear">🗑 Clear</button>',
      '    </div>',
      '  </div>',
      '  <div class="bl-code">',
      '    <div class="bl-palette"></div>',
      '    <div class="bl-scriptwrap">',
      '      <div class="bl-scripthead"><span>Your program</span> <span class="bl-count"></span></div>',
      '      <div class="bl-script" tabindex="0"></div>',
      '    </div>',
      '  </div>',
      '</div>'
    ].join("");
    container.appendChild(root);

    // cache elements
    this.el.root = root;
    this.el.levels = root.querySelector(".bl-levels");
    this.el.mtitle = root.querySelector(".bl-mtitle");
    this.el.idea = root.querySelector(".bl-idea");
    this.el.mbody = root.querySelector(".bl-mbody");
    this.el.canvas = root.querySelector(".bl-stage");
    this.el.ctx = this.el.canvas.getContext("2d");
    this.el.status = root.querySelector(".bl-status");
    this.el.palette = root.querySelector(".bl-palette");
    this.el.script = root.querySelector(".bl-script");
    this.el.count = root.querySelector(".bl-count");
    this.el.go = root.querySelector(".bl-go");
    this.el.stop = root.querySelector(".bl-stop");
    this.el.reset = root.querySelector(".bl-reset");
    this.el.speed = root.querySelector(".bl-speed");
    this.el.clear = root.querySelector(".bl-clear");

    // wire controls
    var self = this;
    this.el.go.addEventListener("click", function () { self.run(); });
    this.el.stop.addEventListener("click", function () { self.stop(); });
    this.el.reset.addEventListener("click", function () { self.resetSprite(); });
    this.el.clear.addEventListener("click", function () { self.clearProgram(); });
    this.el.speed.addEventListener("click", function () {
      self.speedIndex = (self.speedIndex + 1) % SPEEDS.length;
      self.el.speed.textContent = SPEEDS[self.speedIndex].label;
    });
    root.querySelector(".bl-read").addEventListener("click", function () { self.readAloud(); });
    root.querySelector(".bl-hint").addEventListener("click", function () { self.showHint(); });
    this.el.script.addEventListener("click", function (e) {
      if (e.target === self.el.script) { self.insertTargetId = null; self.selectedId = null; self.renderScript(); }
    });

    this.el.speed.textContent = SPEEDS[this.speedIndex].label;
    this.buildPalette();
    this.buildLevelTabs();
    this.mounted = true;
    this.loadLevel(this.levelIndex);
  };

  BL.buildLevelTabs = function () {
    var self = this;
    var best = loadStars();
    this.el.levels.innerHTML = "";
    LEVELS.forEach(function (lv, i) {
      var b = document.createElement("button");
      b.className = "bl-lvtab" + (i === self.levelIndex ? " on" : "");
      var stars = best[i] ? " " + "★".repeat(best[i]) : "";
      b.innerHTML = (lv.sandbox ? "🎨 " : (i + 1) + ". ") + escapeHtml(lv.title) +
        '<span class="bl-lvstars">' + stars + "</span>";
      b.addEventListener("click", function () { self.loadLevel(i); });
      self.el.levels.appendChild(b);
    });
  };

  BL.buildPalette = function () {
    var self = this;
    this.el.palette.innerHTML = '<div class="bl-palette-title">Blocks</div>';
    PALETTE.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "bl-pblock cat-" + p.cat;
      b.textContent = p.label;
      b.addEventListener("click", function () { self.addBlock(p.type); });
      self.el.palette.appendChild(b);
    });
    var tip = document.createElement("div");
    tip.className = "bl-palette-tip";
    tip.textContent = "Tip: tap the dotted slot inside a repeat to drop blocks INSIDE the loop.";
    this.el.palette.appendChild(tip);
  };

  // ---------------------------------------------------------------------
  //  LEVEL / STATE
  // ---------------------------------------------------------------------
  BL.loadLevel = function (i) {
    this.stop();
    this.levelIndex = i;
    this.program = [];
    this.selectedId = null;
    this.insertTargetId = null;
    var lv = LEVELS[i];
    this.el.mtitle.textContent = lv.title;
    this.el.idea.textContent = "— " + lv.idea;
    this.el.mbody.textContent = lv.mission;
    this.resetSprite();
    this.renderScript();
    this.buildLevelTabs();
    this.setStatus(lv.sandbox ? "Sandbox: play freely!" : "Add blocks, then press GO.", "");
  };

  BL.resetSprite = function () {
    var lv = LEVELS[this.levelIndex];
    this.sprite = { col: lv.start.col, row: lv.start.row, dir: lv.start.dir };
    this.stars = lv.stars.map(function (s) { return { col: s.col, row: s.row }; });
    this.bubble = "";
    this.crashed = false;
    this.draw();
  };

  BL.clearProgram = function () {
    if (this.running) return;
    this.program = [];
    this.selectedId = null;
    this.insertTargetId = null;
    this.renderScript();
  };

  // ---------------------------------------------------------------------
  //  AST manipulation
  // ---------------------------------------------------------------------
  function newBlock(type) {
    var b = { id: uid(), type: type };
    if (type === "move") b.n = 1;
    if (type === "wait") b.n = 1;
    if (type === "repeat") { b.n = 2; b.children = []; }
    if (type === "say") b.text = "Hi!";
    return b;
  }

  // find target array to insert into + the block by id (returns {arr, block, parentArr, index})
  function findBlock(arr, id, parent) {
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) return { arr: arr, block: arr[i], parent: parent, index: i };
      if (arr[i].children) {
        var r = findBlock(arr[i].children, id, arr[i]);
        if (r) return r;
      }
    }
    return null;
  }

  BL.addBlock = function (type) {
    if (this.running) return;
    var block = newBlock(type);
    var target = this.program;
    if (this.insertTargetId) {
      var r = findBlock(this.program, this.insertTargetId);
      if (r && r.block.children) target = r.block.children;
    }
    target.push(block);
    this.selectedId = block.id;
    this.renderScript();
  };

  BL.changeNum = function (id, delta) {
    var r = findBlock(this.program, id);
    if (!r) return;
    var b = r.block;
    if (b.type === "wait") {
      b.n = Math.max(0, Math.round((b.n + delta) * 10) / 10);
    } else {
      b.n = Math.max(b.type === "repeat" ? 1 : 0, b.n + delta);
    }
    this.renderScript();
  };

  BL.setText = function (id, text) {
    var r = findBlock(this.program, id);
    if (r) r.block.text = text;
  };

  BL.deleteBlock = function (id) {
    var r = findBlock(this.program, id);
    if (!r) return;
    r.arr.splice(r.index, 1);
    if (this.selectedId === id) this.selectedId = null;
    if (this.insertTargetId === id) this.insertTargetId = null;
    this.renderScript();
  };

  BL.duplicateBlock = function (id) {
    var r = findBlock(this.program, id);
    if (!r) return;
    var copy = deepCopy(r.block);
    r.arr.splice(r.index + 1, 0, copy);
    this.selectedId = copy.id;
    this.renderScript();
  };

  BL.moveBlock = function (id, dir) {
    var r = findBlock(this.program, id);
    if (!r) return;
    var ni = r.index + dir;
    if (ni < 0 || ni >= r.arr.length) return;
    var tmp = r.arr[ni]; r.arr[ni] = r.arr[r.index]; r.arr[r.index] = tmp;
    this.renderScript();
  };

  function deepCopy(b) {
    var c = { id: uid(), type: b.type };
    if ("n" in b) c.n = b.n;
    if ("text" in b) c.text = b.text;
    if (b.children) c.children = b.children.map(deepCopy);
    return c;
  }

  // ---------------------------------------------------------------------
  //  Rendering the script area
  // ---------------------------------------------------------------------
  BL.renderScript = function () {
    var self = this;
    var s = this.el.script;
    s.innerHTML = "";
    if (this.program.length === 0) {
      var empty = document.createElement("div");
      empty.className = "bl-empty";
      empty.textContent = "Tap a coloured block on the left to start your program.";
      s.appendChild(empty);
    } else {
      this.program.forEach(function (b) { s.appendChild(self.renderBlock(b)); });
    }
    this.el.count.textContent = countBlocks(this.program) + " block" + (countBlocks(this.program) === 1 ? "" : "s");
  };

  function countBlocks(arr) {
    var n = 0;
    arr.forEach(function (b) { n++; if (b.children) n += countBlocks(b.children); });
    return n;
  }

  BL.renderBlock = function (b) {
    var self = this;
    var meta = paletteMeta(b.type);
    var wrap = document.createElement("div");
    wrap.className = "bl-block cat-" + meta.cat + (this.selectedId === b.id ? " sel" : "");

    var row = document.createElement("div");
    row.className = "bl-block-row";

    var label = document.createElement("span");
    label.className = "bl-block-label";
    label.textContent = blockText(b);
    label.addEventListener("click", function (e) {
      e.stopPropagation();
      self.selectedId = (self.selectedId === b.id ? null : b.id);
      self.renderScript();
    });
    row.appendChild(label);

    // steppers for numeric blocks
    if (b.type === "move" || b.type === "wait" || b.type === "repeat") {
      var minus = mkMini("−", function (e) { e.stopPropagation(); self.changeNum(b.id, b.type === "wait" ? -0.5 : -1); });
      var plus = mkMini("+", function (e) { e.stopPropagation(); self.changeNum(b.id, b.type === "wait" ? 0.5 : 1); });
      row.appendChild(minus); row.appendChild(plus);
    }

    // text input for say
    if (b.type === "say") {
      var inp = document.createElement("input");
      inp.className = "bl-say-input";
      inp.value = b.text;
      inp.maxLength = 24;
      inp.addEventListener("click", function (e) { e.stopPropagation(); });
      inp.addEventListener("input", function () { self.setText(b.id, inp.value); });
      row.appendChild(inp);
    }

    wrap.appendChild(row);

    // toolbar when selected
    if (this.selectedId === b.id) {
      var tb = document.createElement("div");
      tb.className = "bl-toolbar";
      tb.appendChild(mkTool("▲", "Move up", function (e) { e.stopPropagation(); self.moveBlock(b.id, -1); }));
      tb.appendChild(mkTool("▼", "Move down", function (e) { e.stopPropagation(); self.moveBlock(b.id, 1); }));
      tb.appendChild(mkTool("⧉", "Copy", function (e) { e.stopPropagation(); self.duplicateBlock(b.id); }));
      tb.appendChild(mkTool("✕", "Delete", function (e) { e.stopPropagation(); self.deleteBlock(b.id); }));
      wrap.appendChild(tb);
    }

    // children slot for repeat
    if (b.children) {
      var slot = document.createElement("div");
      slot.className = "bl-slot" + (this.insertTargetId === b.id ? " active" : "");
      slot.addEventListener("click", function (e) {
        e.stopPropagation();
        self.insertTargetId = (self.insertTargetId === b.id ? null : b.id);
        self.renderScript();
      });
      if (b.children.length === 0) {
        var ph = document.createElement("div");
        ph.className = "bl-slot-ph";
        ph.textContent = (this.insertTargetId === b.id) ? "▶ blocks land here — now tap a block" : "tap to add blocks inside";
        slot.appendChild(ph);
      } else {
        b.children.forEach(function (c) { slot.appendChild(self.renderBlock(c)); });
      }
      wrap.appendChild(slot);
      var end = document.createElement("div");
      end.className = "bl-repeat-end cat-" + meta.cat;
      wrap.appendChild(end);
    }
    return wrap;
  };

  function mkMini(txt, fn) {
    var b = document.createElement("button");
    b.className = "bl-mini"; b.textContent = txt; b.addEventListener("click", fn);
    return b;
  }
  function mkTool(txt, title, fn) {
    var b = document.createElement("button");
    b.className = "bl-tool"; b.textContent = txt; b.title = title; b.addEventListener("click", fn);
    return b;
  }
  function paletteMeta(type) {
    for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].type === type) return PALETTE[i];
    return { cat: "control" };
  }
  function blockText(b) {
    switch (b.type) {
      case "move": return "move " + b.n + " step" + (b.n === 1 ? "" : "s");
      case "left": return "turn ↺ left";
      case "right": return "turn ↻ right";
      case "say": return "say";
      case "wait": return "wait " + b.n + " sec";
      case "repeat": return "repeat " + b.n;
    }
    return b.type;
  }

  // ---------------------------------------------------------------------
  //  Execution — unroll AST into primitive steps, then animate
  // ---------------------------------------------------------------------
  BL.unroll = function (arr, out, guard) {
    for (var i = 0; i < arr.length; i++) {
      if (guard.count > 4000) return; // safety cap
      var b = arr[i];
      if (b.type === "move") {
        for (var m = 0; m < b.n; m++) { out.push({ op: "step", id: b.id }); guard.count++; }
      } else if (b.type === "left") { out.push({ op: "left", id: b.id }); guard.count++; }
      else if (b.type === "right") { out.push({ op: "right", id: b.id }); guard.count++; }
      else if (b.type === "say") { out.push({ op: "say", id: b.id, text: b.text }); guard.count++; }
      else if (b.type === "wait") { out.push({ op: "wait", id: b.id, sec: b.n }); guard.count++; }
      else if (b.type === "repeat") {
        for (var r = 0; r < b.n; r++) { this.unroll(b.children, out, guard); }
      }
    }
  };

  BL.run = function () {
    if (this.running) return;
    if (this.program.length === 0) { this.setStatus("Add some blocks first!", "warn"); return; }
    this.resetSprite();
    var steps = [];
    this.unroll(this.program, steps, { count: 0 });
    if (steps.length === 0) { this.setStatus("Nothing to run yet.", "warn"); return; }

    this.running = true;
    this.crashed = false;
    this.el.go.disabled = true;
    this.el.stop.disabled = false;
    this.el.clear.disabled = true;
    this.setStatus("Running…", "");

    var self = this;
    var idx = 0;
    function tick() {
      if (!self.running) return;
      if (idx >= steps.length) { self.finish(); return; }
      var st = steps[idx++];
      var ok = self.doStep(st);
      self.draw();
      if (!ok) { self.crash(); return; }
      if (self.checkWin()) { self.finish(true); return; }
      var delay = SPEEDS[self.speedIndex].ms;
      if (st.op === "wait") delay = Math.max(delay, st.sec * 1000);
      self._timer = setTimeout(tick, delay);
    }
    tick();
  };

  BL.doStep = function (st) {
    var sp = this.sprite, lv = LEVELS[this.levelIndex];
    if (st.op === "left") { sp.dir = DIRS[(DIRS.indexOf(sp.dir) + 3) % 4]; return true; }
    if (st.op === "right") { sp.dir = DIRS[(DIRS.indexOf(sp.dir) + 1) % 4]; return true; }
    if (st.op === "say") { this.bubble = st.text; return true; }
    if (st.op === "wait") { return true; }
    if (st.op === "step") {
      var d = DELTA[sp.dir];
      var nc = sp.col + d.dc, nr = sp.row + d.dr;
      // off-grid?
      if (nc < 0 || nr < 0 || nc >= lv.cols || nr >= lv.rows) return false;
      // wall?
      for (var i = 0; i < lv.walls.length; i++) {
        if (lv.walls[i].col === nc && lv.walls[i].row === nr) return false;
      }
      sp.col = nc; sp.row = nr;
      // collect star
      for (var j = this.stars.length - 1; j >= 0; j--) {
        if (this.stars[j].col === nc && this.stars[j].row === nr) this.stars.splice(j, 1);
      }
      return true;
    }
    return true;
  };

  BL.checkWin = function () {
    var lv = LEVELS[this.levelIndex];
    if (lv.sandbox) return false;
    return this.stars.length === 0;
  };

  BL.crash = function () {
    this.crashed = true;
    this.running = false;
    this._resetButtons();
    this.setStatus("💥 Crash! Pip hit something. Which block sent Pip there?", "bad");
    this.draw();
  };

  BL.finish = function (won) {
    this.running = false;
    this._resetButtons();
    var lv = LEVELS[this.levelIndex];
    if (lv.sandbox) { this.setStatus("Nice — sandbox run finished. Keep experimenting!", "good"); return; }
    if (won || this.checkWin()) {
      var blocks = countBlocks(this.program);
      var stars = 1;
      if (blocks <= lv.par) stars = 3;
      else if (blocks <= lv.par + 2) stars = 2;
      saveStars(this.levelIndex, stars);
      this.buildLevelTabs();
      var msg = "🎉 Solved! " + "★".repeat(stars) + "☆".repeat(3 - stars) +
        "  (" + blocks + " blocks, par " + lv.par + ")";
      if (stars < 3) msg += " — can you do it in fewer blocks for 3 stars?";
      this.setStatus(msg, "good");
    } else {
      this.setStatus("Program finished, but not all stars collected. Try again!", "warn");
    }
  };

  BL.stop = function () {
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    this.running = false;
    this._resetButtons();
  };

  BL._resetButtons = function () {
    if (!this.el.go) return;
    this.el.go.disabled = false;
    this.el.stop.disabled = true;
    this.el.clear.disabled = false;
  };

  BL.setStatus = function (text, kind) {
    if (!this.el.status) return;
    this.el.status.textContent = text;
    this.el.status.className = "bl-status" + (kind ? " " + kind : "");
  };

  // ---------------------------------------------------------------------
  //  Canvas drawing
  // ---------------------------------------------------------------------
  BL.draw = function () {
    var ctx = this.el.ctx, lv = LEVELS[this.levelIndex];
    var W = this.el.canvas.width, H = this.el.canvas.height;
    var cell = Math.min(W / lv.cols, H / lv.rows);
    var ox = (W - cell * lv.cols) / 2, oy = (H - cell * lv.rows) / 2;

    ctx.clearRect(0, 0, W, H);
    // background
    ctx.fillStyle = "#eaf3ff";
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = "#c7ddf5";
    ctx.lineWidth = 1;
    for (var c = 0; c <= lv.cols; c++) {
      ctx.beginPath(); ctx.moveTo(ox + c * cell, oy); ctx.lineTo(ox + c * cell, oy + lv.rows * cell); ctx.stroke();
    }
    for (var r = 0; r <= lv.rows; r++) {
      ctx.beginPath(); ctx.moveTo(ox, oy + r * cell); ctx.lineTo(ox + lv.cols * cell, oy + r * cell); ctx.stroke();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var fs = Math.floor(cell * 0.6);
    ctx.font = fs + "px sans-serif";

    // walls
    lv.walls.forEach(function (w) {
      ctx.fillText("🌳", ox + (w.col + 0.5) * cell, oy + (w.row + 0.5) * cell);
    });
    // stars
    this.stars.forEach(function (s) {
      ctx.fillText("⭐", ox + (s.col + 0.5) * cell, oy + (s.row + 0.5) * cell);
    });

    // sprite (a friendly creature that shows facing)
    var sp = this.sprite;
    var cx = ox + (sp.col + 0.5) * cell, cy = oy + (sp.row + 0.5) * cell;
    var rad = cell * 0.34;
    // direction pointer
    var d = DELTA[sp.dir];
    ctx.fillStyle = this.crashed ? "#d63838" : "#ff8c1a";
    ctx.beginPath();
    ctx.moveTo(cx + d.dc * rad * 1.5, cy + d.dr * rad * 1.5);
    // perpendicular base
    var px = -d.dr, py = d.dc;
    ctx.lineTo(cx + px * rad, cy + py * rad);
    ctx.lineTo(cx - px * rad, cy - py * rad);
    ctx.closePath();
    ctx.fill();
    // body
    ctx.fillStyle = this.crashed ? "#e15a5a" : "#ffb14d";
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#a85a00"; ctx.lineWidth = 2; ctx.stroke();
    // eyes
    ctx.fillStyle = "#2b2b2b";
    var ex = d.dc * rad * 0.25, ey = d.dr * rad * 0.25;
    ctx.beginPath(); ctx.arc(cx + ex - py * rad * 0.3, cy + ey + px * rad * 0.3, rad * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + ex + py * rad * 0.3, cy + ey - px * rad * 0.3, rad * 0.12, 0, Math.PI * 2); ctx.fill();

    // speech bubble
    if (this.bubble) {
      var text = this.bubble;
      ctx.font = Math.floor(cell * 0.3) + "px sans-serif";
      var tw = ctx.measureText(text).width + 16;
      var bx = cx + rad, by = cy - rad - cell * 0.5;
      bx = Math.min(bx, W - tw - 6); by = Math.max(by, 6);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#8ab4e8";
      roundRect(ctx, bx, by, tw, cell * 0.5, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#333"; ctx.textAlign = "center";
      ctx.fillText(text, bx + tw / 2, by + cell * 0.25);
    }
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------------------------------------------------------------------
  //  Read-aloud + hint
  // ---------------------------------------------------------------------
  BL.readAloud = function () {
    var lv = LEVELS[this.levelIndex];
    var text = lv.title + ". " + lv.mission;
    if ("speechSynthesis" in window) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
        this.setStatus("🔊 Reading the mission…", "");
      } catch (e) { this.setStatus(text, ""); }
    } else {
      this.setStatus(text, "");
    }
  };

  BL.showHint = function () {
    this.setStatus("💡 " + LEVELS[this.levelIndex].hint, "warn");
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  window.GN_BlockLab = BL;
})();

</script>
  <script>
/* =====================================================================
   GRADE NEXT — SCRATCH CODING ACADEMY
   app.js — navigation, rendering, progress, deep-links, integration
   ---------------------------------------------------------------------
   Self-contained, no dependencies, works from file:// or any host.
   Designed to be embedded in the Grade Next platform (see README):
     • Hash routing gives every level & session a shareable URL.
     • ?embed=1 hides the site chrome so it drops cleanly into an iframe.
     • ?session=1-5 (or ?level=2) deep-links straight to content.
     • window.GradeNext API + postMessage let the host track progress.
   ===================================================================== */
(function () {
  "use strict";

  var LEVELS = window.GN_LEVELS || [];
  var app;                 // #app container
  var STORE_KEY = "gn_progress_v1";
  var params = new URLSearchParams(location.search);
  var EMBED = params.get("embed") === "1";

  /* ---------------- Scratch-faithful block colouring ---------------- */
  var CAT_COLORS = {
    motion: "#4C97FF", looks: "#9966FF", sound: "#CF63CF", events: "#FFBF00",
    control: "#FFAB19", sensing: "#5CB1D6", operators: "#59C059",
    variables: "#FF8C1A", myblocks: "#FF6680", pen: "#0FBD8C", other: "#9aa4b2"
  };
  function blockCategory(raw) {
    var s = String(raw).toLowerCase();
    // explicit "— Category" hints first
    if (/—\s*motion|\(motion\)/.test(s)) return "motion";
    if (/—\s*looks|\(looks\)/.test(s)) return "looks";
    if (/—\s*sound|\(sound\)/.test(s)) return "sound";
    if (/—\s*events|\(events\)/.test(s)) return "events";
    if (/—\s*control|\(control\)/.test(s)) return "control";
    if (/—\s*sensing|\(sensing\)/.test(s)) return "sensing";
    if (/—\s*operators|\(operators\)/.test(s)) return "operators";
    if (/—\s*variables|\(variables\)/.test(s)) return "variables";
    if (/my ?blocks/.test(s)) return "myblocks";
    if (/—\s*pen|\bpen\b/.test(s)) return "pen";
    // keyword fallback
    if (/\bpen\b|stamp/.test(s)) return "pen";
    if (/custom block|define\b|recursion/.test(s)) return "myblocks";
    if (/variable|\bset \[|change \[|\blist\b|add \(|item \(|insert |replace item|contains\?/.test(s)) return "variables";
    if (/\+|\*|random|\bjoin\b|\band\b|\bor\b|\bnot\b|<|>|=|operator/.test(s)) return "operators";
    if (/touching|mouse|pressed\?|distance|\bask\b|answer|timer|sensing/.test(s)) return "sensing";
    if (/repeat|forever|if |else|wait|stop|clone|control/.test(s)) return "control";
    if (/when |broadcast|green flag|event/.test(s)) return "events";
    if (/say|think|costume|backdrop|size|effect|show|hide|graphic|looks/.test(s)) return "looks";
    if (/\bsound\b|play |volume/.test(s)) return "sound";
    if (/move |turn|glide|go to|point|change x|change y|set x|set y|on edge|direction|velocity|gravity/.test(s)) return "motion";
    return "other";
  }

  /* ---------------- Progress store ---------------- */
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  var PROGRESS = loadProgress();
  PROGRESS.completed = PROGRESS.completed || {};
  PROGRESS.checks = PROGRESS.checks || {};

  function sessionKey(lv, n) { return lv + "-" + n; }
  function isComplete(lv, n) { return !!PROGRESS.completed[sessionKey(lv, n)]; }
  function setComplete(lv, n, val) {
    PROGRESS.completed[sessionKey(lv, n)] = val;
    if (!val) delete PROGRESS.completed[sessionKey(lv, n)];
    saveProgress(PROGRESS);
    notifyHost("progress", { level: lv, session: n, complete: val, overall: overallPercent() });
  }
  function levelPercent(levelObj) {
    var total = levelObj.sessions.length, done = 0;
    for (var i = 1; i <= total; i++) if (isComplete(levelObj.level, i)) done++;
    return total ? Math.round(done / total * 100) : 0;
  }
  function overallPercent() {
    var total = 0, done = 0;
    LEVELS.forEach(function (l) {
      total += l.sessions.length;
      for (var i = 1; i <= l.sessions.length; i++) if (isComplete(l.level, i)) done++;
    });
    return total ? Math.round(done / total * 100) : 0;
  }

    openSession: function (level, n) { location.hash = "#/session/" + level + "/" + n; },
    openLevel: function (level) { location.hash = "#/level/" + level; },
    getProgress: function () {

    },
    markComplete: function (level, n, val) { setComplete(level, n, val !== false); render(); }
  };

      else if (k.slice(0, 2) === "on" && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);

        // auto-complete session when all boxes ticked
        if (arr.length >= s.checklist.length && arr.slice(0, s.checklist.length).every(Boolean)) {
          if (!isComplete(levelNum, n)) { setComplete(levelNum, n, true); refreshProgressUI(levelNum, n); }

  function downloadStarter(key, fname) {
    var data = window.GN_STARTERS_DATA && window.GN_STARTERS_DATA[key];
    if (data) {
      try {
        var bin = atob(data), len = bin.length, arr = new Uint8Array(len);
        for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([arr], { type: "application/octet-stream" }));

        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 2000);
        return;
      } catch (e) { /* fall through to path */ }
    }
    var base = window.GN_STARTER_BASEURL || "starters/";
    var a2 = h("a", { href: base + fname, download: fname, target: "_blank", rel: "noopener" });
    document.body.appendChild(a2); a2.click();

  function spriteEmoji(name) {
    var n = name.toLowerCase();
    if (/hero|player/.test(n)) return "🐱";

    if (/coin/.test(n)) return "🪙";

    if (/flag|goal|base/.test(n)) return "🚩";
    if (/basket/.test(n)) return "🧺";
    if (/creeper/.test(n)) return "🟩";
    if (/villager/.test(n)) return "🧑";
    if (/bird/.test(n)) return "🐤";
    if (/pipe/.test(n)) return "🟢";
    if (/platform/.test(n)) return "🟫";
    if (/paddle/.test(n)) return "🏓";
    if (/ball/.test(n)) return "⚪";
    if (/brick/.test(n)) return "🧱";
    if (/enemy/.test(n)) return "👹";
    if (/spike/.test(n)) return "🔺";
    if (/ship/.test(n)) return "🚀";
    if (/bullet/.test(n)) return "🔆";
    if (/alien/.test(n)) return "👾";
    if (/cookie/.test(n)) return "🍪";
    if (/dancer/.test(n)) return "🕺";
    return "🎭";
  }

  function starterPanel(levelNum, n) {
    var key = padKey(levelNum, n);
    var meta = (window.GN_STARTERS && window.GN_STARTERS[key]) || null;
    var fname = (meta && meta.file) || (key + ".sb3");
    var wrap = h("div", { class: "panel starter-panel" });

    wrap.appendChild(h("div", { class: "sp-head" }, [
      h("span", { class: "sp-emoji" }, ["🐱"]),
      h("div", {}, [
        h("h3", {}, ["Do this exercise in Scratch"]),
        h("p", {}, ["This starter opens in Scratch with the sprites for this exercise already loaded — no blank canvas, so students start building straight away."])
      ])
    ]));

    if (meta && meta.sprites && meta.sprites.length) {
      var chips = h("div", { class: "sprite-chips" });
      meta.sprites.forEach(function (sName) {
        chips.appendChild(h("span", { class: "sprite-chip" }, [spriteEmoji(sName) + " " + sName]));
      });
      wrap.appendChild(h("div", { class: "sp-sprites" }, [
        h("span", { class: "sp-label" }, ["Sprites already in this project"]),
        chips,
        h("span", { class: "sp-backdrop" }, ["🖼️ Backdrop: " + (meta.backdrop || "Plain")])
      ]));
    }

    var actions = h("div", { class: "sp-actions" });
    actions.appendChild(h("button", { class: "btn primary", onclick: function () { downloadStarter(key, fname); } }, ["⬇ Download this starter (.sb3)"]));
    actions.appendChild(h("a", { class: "btn ghost", href: "https://scratch.mit.edu/projects/editor/", target: "_blank", rel: "noopener" }, ["↗ Open Scratch"]));
    if (window.GN_STARTER_BASEURL) {
      var purl = window.GN_STARTER_BASEURL + fname;
      actions.appendChild(h("a", { class: "btn ghost", href: "https://turbowarp.org/editor?project_url=" + encodeURIComponent(purl), target: "_blank", rel: "noopener", title: "Opens a Scratch-compatible editor with the project already loaded" }, ["⚡ Open pre-loaded (1-click)"]));
    }
    wrap.appendChild(actions);

    wrap.appendChild(h("ol", { class: "sp-steps" }, [
      h("li", {}, [h("strong", {}, ["Download"]), " the starter project above."]),
      h("li", {}, [h("strong", {}, ["Open Scratch"]), " with the button above."]),
      h("li", {}, ["In Scratch choose ", h("strong", {}, ["File → Load from your computer"]), " and pick the file you just downloaded. The sprites appear, ready to code."])
    ]));

    wrap.appendChild(h("p", { class: "sp-note" }, [
      "New to dragging blocks? Try the ",
      h("button", { class: "linkish", onclick: function () { location.hash = "#/lab"; } }, ["Block Lab"]),
      " first — same ideas, no dragging."
    ]));
    return wrap;
  }

  /* ---------------- Block Lab view ---------------- */
  function viewLab() {
    var wrap = h("div", { class: "view lab" });
    wrap.appendChild(h("div", { class: "crumbs" }, [crumb("Home", "#/"), sep(), h("span", {}, ["Block Lab"])]));
    var host = h("div", { class: "lab-host", id: "blocklab-root" });
    wrap.appendChild(host);
    // mount after it's in the DOM
    setTimeout(function () { if (window.GN_BlockLab) window.GN_BlockLab.mount(host); }, 0);
    return wrap;
  }

  /* ---------------- Teacher guide view ---------------- */
  function viewTeacher() {
    var wrap = h("div", { class: "view teacher" });
    wrap.appendChild(h("div", { class: "crumbs" }, [crumb("Home", "#/"), sep(), h("span", {}, ["Teacher Guide"])]));
    wrap.appendChild(h("h1", {}, ["🍎 Teacher Guide"]));
    wrap.appendChild(h("p", { class: "lead" }, ["Everything you need to run the Academy and drop it into the Grade Next platform."]));

    // session shape
    wrap.appendChild(panel("⏱️ Suggested 60-minute session shape", [
      tableFrom(
        ["Minutes", "Segment", "Purpose"],
        [
          ["0–8", "Warm-up (often unplugged)", "Get the concept into the body first"],
          ["8–13", "Demo — teacher on the big screen", "Show one idea, don't tell"],
          ["13–40", "Exercises & project — in pairs", "The core hands-on work"],
          ["40–52", "Challenge / differentiation", "Fast finishers extend; others consolidate"],
          ["52–60", "Show & tell + tick the checklist", "Explaining is where learning sticks"]
        ]
      ),
      h("p", { class: "muted" }, ["Pairs at one device: a Driver (touches) and a Navigator (says what to do). Swap every 8 minutes."])
    ]));

    // scratch starter projects
    wrap.appendChild(panel("🐱 Scratch starter projects (one per session)", [
      h("p", {}, ["Every session's ", h("strong", {}, ["Do this exercise in Scratch"]), " panel gives students a ready-made Scratch project (.sb3) with the exact sprites for that exercise already placed on a themed backdrop — so no one starts from a blank canvas. The Catch lesson ships a basket, apple and gem; the Whack-a-Creeper lesson ships creepers and a villager; the platformer ships a player, platform, coins, an enemy and a goal, and so on."]),
      h("p", {}, ["Students click ", h("strong", {}, ["Download this starter"]), ", open Scratch, then ", h("strong", {}, ["File → Load from your computer"]), " and pick the file. It works with real Scratch and needs no account."]),
      h("p", { class: "muted" }, ["One-click loading: if you host the ", h("code", {}, ["starters/"]), " folder on your site and set ", h("code", {}, ["window.GN_STARTER_BASEURL"]), " to its public URL, each panel also shows a one-click \"Open pre-loaded\" button (opens a Scratch-compatible editor with the project already loaded). The .sb3 files are also embedded in the app, so downloads work offline and in the single-file build."])
    ]));

    // block colour key
    var key = h("div", { class: "cat-key" });
    [["motion", "Motion"], ["looks", "Looks"], ["sound", "Sound"], ["events", "Events"], ["control", "Control"],
     ["sensing", "Sensing"], ["operators", "Operators"], ["variables", "Variables"], ["myblocks", "My Blocks"], ["pen", "Pen"]].forEach(function (c) {
      key.appendChild(h("span", { class: "cat-swatch", style: "--bc:" + CAT_COLORS[c[0]] }, [c[1]]));
    });
    wrap.appendChild(panel("🎨 Scratch block colour key", [
      h("p", {}, ["Block chips in every session are colour-coded to match real Scratch, so colour memory transfers. Motion is blue, Control is orange, and so on."]),
      key
    ]));

    // curriculum map
    var mapWrap = h("div", {});
    LEVELS.forEach(function (lv) {
      mapWrap.appendChild(h("h3", { class: "map-lv" }, [lv.emoji + " Level " + lv.level + " — " + lv.codename + " (" + lv.sessions.length + " sessions)"]));
      var ul = h("ul", { class: "map-modules" });
      lv.modules.forEach(function (m) {
        var group = lv.sessions.map(function (s, i) { return { s: s, n: i + 1 }; }).filter(function (o) { return o.s.module === m; });
        if (!group.length) return;
        var range = group.length ? (group[0].n + "–" + group[group.length - 1].n) : "";
        ul.appendChild(h("li", {}, [h("strong", {}, [m]), " — sessions " + range + " (" + group.length + ")"]));
      });
      mapWrap.appendChild(ul);
    });
    wrap.appendChild(panel("🗺️ Curriculum map", [mapWrap]));

    // rubric
    wrap.appendChild(panel("📊 Assessment rubric (record twice: mid and end of each level)", [
      tableFrom(
        ["Skill", "Emerging", "Developing", "Secure", "Extending"],
        [
          ["Sequence", "Adds blocks randomly", "Builds a sequence with prompting", "Plans before running", "Compares two solutions"],
          ["Loops", "Doesn't use loops", "Uses when told", "Spots patterns unprompted", "Nests loops / explains why shorter"],
          ["Events & control", "One script only", "Uses a key/click trigger", "Coordinates with broadcasts", "Designs clean event flow"],
          ["Variables & data", "Ignores variables", "Uses a score with help", "Uses variables & lists confidently", "Designs a data structure (save/inventory)"],
          ["Debugging", "Deletes & restarts", "Finds bugs with help", "Locates the bug independently", "Predicts bugs before running"],
          ["Game design", "No clear goal", "Copies a build", "Designs a working game", "Iterates from playtest feedback"]
        ]
      )
    ]));

    // integration
    wrap.appendChild(panel("🔌 Embedding in the Grade Next platform", [
      h("p", {}, ["This platform is static and dependency-free, so it embeds anywhere. See the README for the full guide. Quick reference:"]),
      codeBlock([
        '<!-- Drop-in iframe, chrome hidden, deep-linked to a session -->',
        '<iframe src="scratch-academy/index.html?embed=1#/session/1/5"',
        '        style="width:100%;height:800px;border:0"></iframe>',
        '',
        '// Listen for progress from the embedded app',
        'window.addEventListener("message", function (e) {',
        '  if (e.data && e.data.source === "gradenext-scratch") {',
        '    console.log(e.data.type, e.data.data); // "progress", {level, session, complete, overall}',
        '  }',
        '});'
      ]),
      h("p", { class: "muted" }, ["URL parameters: ", h("code", {}, ["?embed=1"]), " hides the site header · ", h("code", {}, ["?session=1-5"]), " or a ", h("code", {}, ["#/session/1/5"]), " hash deep-links to any session · ", h("code", {}, ["?level=2"]), " opens a level."])
    ]));

    return wrap;
  }

  /* ---------------- Shared little components ---------------- */
  function panel(title, kids) {
    return h("div", { class: "panel" }, [h("h3", {}, [title])].concat(kids || []));
  }
  function chip(label, active, fn) {
    return h("button", { class: "chip" + (active ? " on" : ""), onclick: fn }, [label]);
  }
  function crumb(label, hash) { return h("button", { class: "crumb", onclick: function () { location.hash = hash; } }, [label]); }
  function sep() { return h("span", { class: "crumb-sep" }, ["/"]); }
  function tableFrom(headers, rows) {
    var t = h("table", { class: "data-table" });
    var thead = h("thead", {}, [h("tr", {}, headers.map(function (x) { return h("th", {}, [x]); }))]);
    var tbody = h("tbody", {}, rows.map(function (r) { return h("tr", {}, r.map(function (c) { return h("td", {}, [c]); })); }));
    t.appendChild(thead); t.appendChild(tbody);
    return h("div", { class: "table-scroll" }, [t]);
  }
  function codeBlock(lines) { return h("pre", { class: "code-block" }, [lines.join("\n")]); }

  /* ---------------- Router ---------------- */
  function parseHash() {
    var hs = (location.hash || "").replace(/^#\/?/, "");
    var parts = hs.split("/").filter(Boolean);
    if (!parts.length) {
      // support query deep-links on first load
      if (params.get("session")) {
        var m = params.get("session").split("-");
        return { view: "session", level: +m[0], n: +m[1] };
      }
      if (params.get("level")) return { view: "level", level: +params.get("level") };
      return { view: "home" };
    }
    if (parts[0] === "level") return { view: "level", level: +parts[1] };
    if (parts[0] === "session") return { view: "session", level: +parts[1], n: +parts[2] };
    if (parts[0] === "lab") return { view: "lab" };
    if (parts[0] === "teacher") return { view: "teacher" };
    return { view: "home" };
  }

  function render() {
    var route = parseHash();
    app.innerHTML = "";
    var head = renderHeader();
    if (head) app.appendChild(head);
    var main = h("main", { class: "site-main" + (EMBED ? " embed" : "") });
    var view;
    switch (route.view) {
      case "level": view = viewLevel(route.level); break;
      case "session": view = viewSession(route.level, route.n); break;
      case "lab": view = viewLab(); break;
      case "teacher": view = viewTeacher(); break;
      default: view = viewHome();
    }
    main.appendChild(view);
    app.appendChild(main);
    if (!EMBED) app.appendChild(renderFooter());
    if (route.view !== "lab") window.scrollTo(0, 0);
    notifyHost("navigate", route);
  }

  function renderFooter() {
    return h("footer", { class: "site-foot" }, [
      h("p", {}, ["Grade Next · Scratch Coding Academy — 100 game-building sessions for ages 7–12."]),
      h("p", { class: "foot-links" }, [
        h("button", { class: "linkish", onclick: function () { location.hash = "#/teacher"; } }, ["Teacher Guide"]),
        " · ",
        h("a", { href: "https://scratch.mit.edu", target: "_blank", rel: "noopener" }, ["Scratch ↗"])
      ])
    ]);
  }

  /* ---------------- Boot ---------------- */
  function boot() {
    app = document.getElementById("app");
    if (!LEVELS.length) {
      app.innerHTML = '<div style="padding:40px;text-align:center">Curriculum failed to load. Check that the curriculum-level*.js files are present.</div>';
      return;
    }
    // On GitHub Pages the starter .sb3 files are served with permissive CORS,
    // so we can offer the one-click "Open pre-loaded in Scratch" button
    // automatically (unless the host already configured a base URL).
    if (!window.GN_STARTER_BASEURL && /(^|\.)github\.io$/i.test(location.hostname)) {
      window.GN_STARTER_BASEURL = location.origin + location.pathname.replace(/[^/]*$/, "") + "starters/";
    }
    window.addEventListener("hashchange", render);
    // normalise a query deep-link into a hash so navigation is consistent
    var r = parseHash();
    if (!location.hash && (params.get("session") || params.get("level"))) {
      if (r.view === "session") location.replace("#/session/" + r.level + "/" + r.n);
      else if (r.view === "level") location.replace("#/level/" + r.level);
    }
    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
