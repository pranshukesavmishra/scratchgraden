name: Deploy to GitHub Pages

# NOTE: GitHub Pages must be enabled once by a repo admin before this runs.
#   Settings -> Pages -> "Build and deployment":
#     • Easiest: Source = "Deploy from a branch", Branch =
#       claude/scratch-exercises-platform-25bxh0 , folder = / (root). Done — no
#       workflow needed; GitHub serves index.html directly.
#     • Or: Source = "GitHub Actions", then run this workflow (Actions tab ->
#       "Deploy to GitHub Pages" -> Run workflow).
# This workflow is manual-dispatch only so it never fails automatically before
# Pages has been enabled.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
